openapi: 3.2.0
info:
  title: Signaturely User API
  description: REST API for Signaturely, simple electronic signature software.
  version: v1
  contact:
    name: Signaturely
    url: https://signaturely.com/api
  x-apisjson-aid: signaturely
servers:
- url: https://api.signaturely.com/api/v1
  description: Signaturely production API
security:
- ApiKeyAuth: []
tags:
- name: User
  description: Account information for the authenticated API key.
paths:
  /user/by-api:
    get:
      tags:
      - User
      summary: Get user
      description: Retrieve information about the user account tied to your API key.
      responses:
        '200':
          description: User account information.
      operationId: getUserByApi
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API key sent as: Authorization: Api-Key {API_KEY}'
