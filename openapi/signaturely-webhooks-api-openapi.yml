openapi: 3.2.0
info:
  title: Signaturely Webhooks API
  description: REST API for Signaturely, simple electronic signature software.
  version: v1
  contact:
    name: Signaturely
    url: https://signaturely.com/api
  x-apisjson-aid: signaturely
servers:
- url: https://api.signaturely.com/api/v1
  description: Signaturely production API
security:
- ApiKeyAuth: []
tags:
- name: Webhooks
  description: Subscribe to document lifecycle events.
paths:
  /hooks/subscribe:
    post:
      tags:
      - Webhooks
      summary: Subscribe a webhook URL
      description: Register an HTTP endpoint to receive document event notifications. Documented events include document_sent and document_completed.
      responses:
        '200':
          description: Webhook subscribed.
      operationId: postHooksSubscribe
      x-operation-id-source: derived
  /hooks/unsubscribe:
    post:
      tags:
      - Webhooks
      summary: Unsubscribe a webhook URL
      responses:
        '200':
          description: Webhook unsubscribed.
      operationId: postHooksUnsubscribe
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API key sent as: Authorization: Api-Key {API_KEY}'
